<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전화기 방명록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Nanum+Myeongjo:wght@400;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top-bar">
    <button id="gallery-toggle-btn" class="ornate-btn" type="button">방명록 보기</button>
  </header>

  <!-- ================= 데스크 / 전화기 화면 ================= -->
  <main id="desk-scene" class="scene" data-state="idle">
    <div class="desk-column">
      <h1 class="main-title">
        <span class="main-title-en">How to be &ldquo;Normal&rdquo;</span>
        <span class="main-title-ko">전화 방명록</span>
      </h1>

      <div class="desk">
        <div id="handset" class="phone-wrap" aria-hidden="true">
          <img src="../전화기.png" alt="전화기" class="phone-image" />
        </div>
      </div>

      <div class="desk-footer">
        <p id="status-text" class="status-text"></p>

        <!-- idle -->
        <button id="call-btn" class="btn call-btn" type="button" aria-label="전화 걸기">☎</button>

        <!-- ringing -->
        <button id="answer-btn" class="btn answer-btn hidden" type="button">통화 시작</button>

        <!-- listening -->
        <div id="listening-panel" class="panel listening-panel hidden">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="live-transcript" class="live-transcript">&hellip; 듣고 있어요 &hellip;</p>
          <div class="panel-actions listening-actions">
            <button id="listen-cancel-btn" class="btn listen-cancel-btn" type="button">그만하기</button>
            <button id="listen-confirm-btn" class="btn confirm-btn" type="button" disabled>등록하기</button>
          </div>
        </div>

        <!-- reviewing -->
        <div id="review-panel" class="panel review-panel hidden">
          <p class="panel-label">이렇게 들었어요</p>
          <p id="review-text" class="review-text"></p>
          <div class="panel-actions">
            <button id="retry-btn" class="btn retry-btn" type="button" aria-label="다시 말하기">↺</button>
            <button id="confirm-btn" class="btn confirm-btn" type="button">등록하기</button>
          </div>
        </div>

        <!-- naming -->
        <div id="naming-panel" class="panel naming-panel hidden">
          <p class="panel-label">남기실 이야기</p>
          <p id="naming-quote" class="naming-quote"></p>

          <label class="panel-label naming-name-label" for="name-input">이름 작성</label>
          <input
            id="name-input"
            class="name-input"
            type="text"
            maxlength="20"
            autocomplete="off"
            placeholder="예) 홍 길 동"
          />
          <p id="date-preview" class="date-stamp"></p>

          <div class="panel-actions">
            <button id="cancel-name-btn" class="btn ghost-btn" type="button">취소</button>
            <button id="save-btn" class="btn confirm-btn" type="button">방명록 남기기</button>
          </div>
        </div>

        <!-- saved -->
        <div id="saved-panel" class="panel saved-panel hidden">
          <div class="stamp-mark">SUCCESS</div>
        </div>

        <p id="error-text" class="error-text hidden"></p>
      </div>
    </div>
  </main>

  <!-- ================= 방명록 갤러리 화면 ================= -->
  <section id="gallery-scene" class="scene hidden" data-state="gallery">
    <div class="gallery-frame">
      <div class="gallery-header">
        <div class="gallery-header-actions">
          <button id="gallery-delete-btn" class="btn gallery-delete-btn" type="button" disabled>선택 삭제</button>
          <button id="back-btn" class="ornate-btn" type="button">돌아가기</button>
        </div>
      </div>
      <div id="gallery-list" class="gallery-list"></div>
    </div>
  </section>

  <div id="admin-modal" class="admin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
    <div class="admin-modal-card">
      <p id="admin-modal-title" class="admin-modal-title">관리자 확인</p>
      <input
        id="admin-password-input"
        class="admin-password-input"
        type="password"
        inputmode="numeric"
        maxlength="20"
        placeholder="비밀번호"
        autocomplete="off"
      />
      <p id="admin-modal-error" class="admin-modal-error hidden"></p>
      <div class="panel-actions">
        <button id="admin-cancel-btn" class="btn listen-cancel-btn" type="button">취소</button>
        <button id="admin-confirm-btn" class="btn confirm-btn" type="button">삭제</button>
      </div>
    </div>
  </div>

  <audio id="ring-audio" src="../call.mp3" preload="auto" playsinline webkit-playsinline></audio>
  <audio id="entry-audio" preload="none" playsinline webkit-playsinline></audio>

  <button id="fullscreen-btn" class="fullscreen-btn" type="button" aria-label="전체화면" title="전체화면">
    <svg class="fullscreen-icon fullscreen-icon-enter" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 3H3v4M17 3h4v4M7 21H3v-4M17 21h4v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="fullscreen-icon fullscreen-icon-exit hidden" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 3v4H5M15 3v4h4M9 21v-4H5M15 21v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/audio-recorder.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
